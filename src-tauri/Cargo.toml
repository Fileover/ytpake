[package]
name = "pake"
version = "1.0.0"
description = "YouTube desktop application built on Tauri 2 and WebView2."
authors = ["Tw93"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.85.0"

[[bin]]
name = "YouTube"
path = "src/main.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["time"] }
tauri = { version = "2.10.2", features = [
  "image-ico",
  "image-png",
  "unstable",
] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-opener = "2.5.3"
tauri-plugin-single-instance = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
] }
webview2-com = "0.38"
windows-core = "0.61.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true

[profile.dev.package."*"]
debug = false
