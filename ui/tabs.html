<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abas</title>
    <style>
      :root {
        --bar: #0f0f0f;
        --line: #2a2a2a;
        --text: #f1f1f1;
        --muted: #a0a0a0;
        --hover: #1c1c1c;
        --tab: #2b2b2b;
        --accent: #ff0033;
      }

      * {
        box-sizing: border-box;
      }

      /* Author display rules beat the browser's [hidden] default, so the
         attribute has to be forced here or hidden buttons stay visible. */
      [hidden] {
        display: none !important;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--bar);
        color: var(--text);
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 12.5px;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 100%;
        padding: 0 6px;
        border-bottom: 1px solid var(--line);
        background: var(--bar);
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 1px;
        padding-right: 4px;
      }

      .icon-button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }

      .icon-button:hover {
        background: var(--hover);
        color: var(--text);
      }

      .icon-button:active {
        background: #303030;
      }

      .icon-button svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .tabs {
        display: flex;
        flex: 0 1 auto;
        align-items: center;
        gap: 4px;
        min-width: 0;
        height: 100%;
        padding: 0 2px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }

      /* Pushes the trailing controls to the right while keeping `+` glued to
         the last tab, the way a browser tab strip behaves. */
      .spacer {
        flex: 1 1 auto;
        min-width: 4px;
        height: 100%;
      }

      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tab {
        position: relative;
        display: flex;
        /* 200px is the ceiling, not the size: `layoutTabs()` writes the real
           width here as the strip fills up. The shrink is not left to CSS on
           purpose — the strip is sized by its content, so a shrinkable tab and
           a growing spacer chased each other and the whole bar resized itself
           on redraws. */
        flex: 0 0 200px;
        /* Without this a long title sets the tab's automatic minimum size and
           the tab grows past its basis — 448px for a full video name, even
           with `flex-basis: 200px`. */
        min-width: 0;
        max-width: 200px;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 6px 0 9px;
        border-radius: 9px;
        color: var(--muted);
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }

      /* Set from script once the strip has a layout. At its narrowest a tab is
         just its icon; the close button takes the icon's place on hover, the
         way vertical tabs do, so the tab keeps one width in both states. */
      .tab.narrow {
        justify-content: center;
        padding: 0;
      }

      .tab.narrow .label,
      .tab.narrow .close {
        display: none;
      }

      .tab.narrow:hover .favicon {
        display: none;
      }

      .tab.narrow:hover .close {
        display: grid;
      }

      .tab:hover {
        background: var(--hover);
        color: #d5d5d5;
      }

      .tab.active {
        background: var(--tab);
        color: var(--text);
      }

      .tab.active::after {
        content: "";
        position: absolute;
        inset: 6px auto 6px 0;
        width: 2px;
        border-radius: 2px;
        background: var(--accent);
        opacity: 0;
      }

      .favicon {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 14px;
        height: 14px;
      }

      .favicon svg {
        width: 14px;
        height: 14px;
        display: block;
      }

      .label {
        flex: 1 1 auto;
        /* Lets the text shrink inside the fixed width instead of widening it. */
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        letter-spacing: 0.1px;
      }

      .close {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 0;
        border-radius: 5px;
        background: transparent;
        color: inherit;
        opacity: 0.5;
        cursor: pointer;
        transition: background 120ms ease, opacity 120ms ease;
      }

      .tab:hover .close,
      .tab.active .close {
        opacity: 0.8;
      }

      .close:hover {
        background: #454545;
        opacity: 1;
      }

      .close svg {
        width: 9px;
        height: 9px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
      }

      .spinner {
        width: 12px;
        height: 12px;
        border: 1.6px solid rgba(255, 255, 255, 0.18);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 720ms linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .new-tab {
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-left: 2px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 120ms ease, color 120ms ease;
      }

      .new-tab:hover {
        background: var(--hover);
        color: var(--text);
      }

      .new-tab svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div class="nav">
        <button class="icon-button" id="back" title="Voltar (Alt+←)">
          <svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8 10 12.5" /></svg>
        </button>
        <button class="icon-button" id="forward" title="Avançar (Alt+→)">
          <svg viewBox="0 0 16 16"><path d="M6 3.5 10.5 8 6 12.5" /></svg>
        </button>
        <button class="icon-button" id="reload" title="Recarregar (Ctrl+R)">
          <svg viewBox="0 0 16 16">
            <path d="M13 8a5 5 0 1 1-1.6-3.7" />
            <path d="M13.2 2.4v2.9h-2.9" />
          </svg>
        </button>
      </div>

      <div class="tabs" id="tabs"></div>

      <button class="new-tab" id="new" title="Nova aba (Ctrl+T)">
        <svg viewBox="0 0 16 16"><path d="M8 3.2v9.6M3.2 8h9.6" /></svg>
      </button>

      <div class="spacer"></div>

      <button class="icon-button" id="extensions" title="Extensões" hidden>
        <svg viewBox="0 0 16 16">
          <path
            d="M6.2 2.6a1.5 1.5 0 0 1 3 0v.9h1.9c.4 0 .7.3.7.7v1.7h.8a1.5 1.5 0 0 1 0 3h-.8v1.7c0 .4-.3.7-.7.7H9.3v.9a1.5 1.5 0 0 1-3 0v-.9H4.5a.7.7 0 0 1-.7-.7v-2h-.9a1.4 1.4 0 0 1 0-2.8h.9v-2c0-.4.3-.7.7-.7h1.7z"
          />
        </svg>
      </button>
    </div>

    <script>
      const api = window.__TAURI__ || {};
      const invoke = api.core?.invoke ?? (() => Promise.resolve());
      const listen = api.event?.listen ?? (() => Promise.resolve());

      const tabsEl = document.getElementById("tabs");
      const extensionsButton = document.getElementById("extensions");
      let state = { tabs: [], active: null, extensions: [] };

      const YOUTUBE_ICON = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="1" y="5" width="22" height="14" rx="4.2" fill="#ff0033" />
          <path d="M10 9.2 15.6 12 10 14.8Z" fill="#fff" />
        </svg>`;

      const PAGE_ICON = `
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9.2" fill="#3d3d3d" />
          <circle cx="12" cy="12" r="3.4" fill="#9a9a9a" />
        </svg>`;

      function isYouTube(url) {
        try {
          return /(^|\.)youtube\.com$|(^|\.)youtu\.be$|(^|\.)google\.com$/.test(
            new URL(url).hostname,
          );
        } catch (error) {
          return false;
        }
      }

      function iconFor(tab) {
        if (tab.loading) return `<div class="spinner"></div>`;
        return isYouTube(tab.url) ? YOUTUBE_ICON : PAGE_ICON;
      }

      function createTab(tab) {
        const element = document.createElement("div");
        element.className = "tab";
        element.dataset.id = String(tab.id);

        const favicon = document.createElement("span");
        favicon.className = "favicon";

        const label = document.createElement("span");
        label.className = "label";

        const close = document.createElement("button");
        close.className = "close";
        close.title = "Fechar aba (Ctrl+W)";
        close.innerHTML = `<svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>`;
        close.addEventListener("click", (event) => {
          event.stopPropagation();
          invoke("tabs_close", { id: Number(element.dataset.id) });
        });

        element.append(favicon, label, close);
        element.addEventListener("click", () =>
          invoke("tabs_activate", { id: Number(element.dataset.id) }),
        );
        /* A middle press starts autoscroll, and once that is armed the mouse is
           captured and the auxclick that follows never arrives — which is why
           the close below only ever fired for a synthetic click. Cancelling the
           press keeps the release ours; auxclick still runs. */
        element.addEventListener("mousedown", (event) => {
          if (event.button === 1) event.preventDefault();
        });
        element.addEventListener("auxclick", (event) => {
          if (event.button === 1) {
            event.preventDefault();
            invoke("tabs_close", { id: Number(element.dataset.id) });
          }
        });
        return element;
      }

      /* Updates the strip in place. Rebuilding every tab on each state emit —
         and a title, a spinner and the active marker all emit — made the whole
         bar reflow several times while a page loaded, which read as the tabs
         changing size on their own. */
      function render() {
        const extensions = state.extensions || [];
        extensionsButton.hidden = extensions.length === 0;
        extensionsButton.title =
          extensions.length === 1 ? extensions[0].name : "Extensões";

        const known = new Map();
        for (const element of tabsEl.children) known.set(Number(element.dataset.id), element);

        const wanted = new Set();
        for (const tab of state.tabs) {
          wanted.add(tab.id);
          const element = known.get(tab.id) || createTab(tab);

          element.classList.toggle("active", tab.id === state.active);

          const label = element.querySelector(".label");
          const text = tab.title || "Nova aba";
          if (label.textContent !== text) label.textContent = text;

          const favicon = element.querySelector(".favicon");
          const icon = iconFor(tab);
          if (favicon.dataset.icon !== icon) {
            favicon.dataset.icon = icon;
            favicon.innerHTML = icon;
          }

          // Appending a node that is already there moves it, so this loop
          // leaves the strip in `state.tabs` order without rebuilding anything.
          tabsEl.append(element);
        }

        for (const [id, element] of known) {
          if (!wanted.has(id)) element.remove();
        }

        const active = tabsEl.querySelector(".tab.active");
        active?.scrollIntoView({ block: "nearest", inline: "nearest" });
        layoutTabs();
      }

      /* Gives every tab its width for the room that is left.
         The strip is sized by its content, so the free space is measured on
         the bar instead: asking the strip how wide it is would make the answer
         depend on the very width being computed, and the bar resized itself
         whenever a title or a spinner changed. The spacer counts as its
         minimum, never as its current width, for the same reason. */
      function layoutTabs() {
        const tabs = [...tabsEl.children];
        if (!tabs.length) return;

        const bar = tabsEl.parentElement;
        const barStyle = getComputedStyle(bar);
        const gap = parseFloat(barStyle.columnGap) || 0;
        const padding =
          parseFloat(barStyle.paddingLeft) + parseFloat(barStyle.paddingRight);

        let taken = 0;
        for (const child of bar.children) {
          if (child === tabsEl) continue;
          // The spacer is what is left over; counting its current width would
          // feed the previous layout back into this one.
          taken += child.classList.contains("spacer") ? 4 : child.offsetWidth;
        }
        const gaps = gap * (bar.children.length - 1);
        // 4px of padding on the strip itself.
        const room = bar.clientWidth - padding - taken - gaps - 4;
        const each = Math.floor((room - 4 * (tabs.length - 1)) / tabs.length);
        const width = Math.max(40, Math.min(200, each));

        for (const tab of tabs) {
          tab.style.flexBasis = width + "px";
          // At this width the name is down to a couple of characters, so the
          // tab shows only its icon and the close button on hover.
          tab.classList.toggle("narrow", width < 84);
        }
      }

      let pendingResize = 0;
      window.addEventListener("resize", () => {
        cancelAnimationFrame(pendingResize);
        pendingResize = requestAnimationFrame(layoutTabs);
      });

      async function refresh() {
        try {
          state = await invoke("tabs_state");
          render();
        } catch (error) {
          /* the shell is not ready yet; the update event will arrive */
        }
      }

      document.getElementById("new").addEventListener("click", () => invoke("tabs_new", {}));
      extensionsButton.addEventListener("click", () =>
        invoke("tabs_extension_menu").catch(() => {}),
      );
      document.getElementById("back").addEventListener("click", () => invoke("tabs_back", {}));
      document.getElementById("forward").addEventListener("click", () => invoke("tabs_forward", {}));
      document.getElementById("reload").addEventListener("click", () => invoke("tabs_reload", {}));

      tabsEl.addEventListener(
        "wheel",
        (event) => {
          if (event.deltaY === 0) return;
          event.preventDefault();
          tabsEl.scrollLeft += event.deltaY;
        },
        { passive: false },
      );

      document.addEventListener("keydown", (event) => {
        if (!(event.ctrlKey || event.metaKey) || event.altKey) return;
        const key = (event.key || "").toLowerCase();
        if (key === "e" && event.shiftKey) {
          event.preventDefault();
          invoke("tabs_extension_menu").catch(() => {});
          return;
        }
        const actions = {
          t: () => invoke("tabs_new", {}),
          w: () => invoke("tabs_close_active", {}),
          r: () => invoke("tabs_reload", {}),
          tab: () => invoke("tabs_cycle", { delta: event.shiftKey ? -1 : 1 }),
        };
        const action = actions[key];
        if (!action) return;
        event.preventDefault();
        action();
      });

      listen("tabs:update", (event) => {
        state = event.payload;
        render();
      }).catch(() => {});

      refresh();
    </script>
  </body>
</html>
